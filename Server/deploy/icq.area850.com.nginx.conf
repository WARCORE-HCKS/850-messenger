# Reverse proxy for 850 Messenger on icq.area850.com
# Put this on a VPS (hosting.com VPS/dedicated). Shared hosting cannot run this.
# The Windows service listens on 127.0.0.1:8500; nginx terminates HTTPS and WebSockets.

server {
    listen 80;
    listen [::]:80;
    server_name icq.area850.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name icq.area850.com;

    ssl_certificate     /etc/letsencrypt/live/icq.area850.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icq.area850.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
